// How much each bucket counts toward the overall composite score. Tune freely — must sum to 1.
const IMPORTANCE = { current: 0.24, b7: 0.07, b14: 0.10, b21: 0.20, b28: 0.25, blank: 0.14 };
const OVERALL_SCORE_GOAL = 0.82; // target composite score

// Hitting the goal exactly scores 90; maxing out (100% current, or 0% on a past-due bucket)
// scores 100, scaling linearly between the two. Missing the goal scales 0-90 the same way
// scoring used to scale 0-100, just compressed to leave room above for "beat the goal."
function scoreFor(bucketKey, actualPct, goalPct){
  const isCurrent = bucketKey === 'current';
  const maxPct = isCurrent ? 1 : 0; // best-possible value for this bucket
  const metGoal = isCurrent ? actualPct >= goalPct : actualPct <= goalPct;

  if(metGoal){
    const span = Math.abs(maxPct - goalPct);
    if(span <= 0) return 1; // goal already IS the max (e.g. a 0% goal)
    const t = Math.max(0, Math.min(1, Math.abs(actualPct - goalPct) / span));
    return 0.90 + 0.10 * t;
  }
  if(isCurrent){
    if(goalPct <= 0) return 0.90;
    return 0.90 * Math.max(0, Math.min(1, actualPct / goalPct));
  }
  if(goalPct <= 0) return 0;
  return 0.90 * Math.max(0, Math.min(1, goalPct / actualPct));
}

// ---------- date / bucket helpers ----------
function todayLocalMidnight(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function parseDateStr(s){ if(!s) return null; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? null : d; }
function daysBetween(a,b){ return Math.round((a - b) / 86400000); }
function toDateStr(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function mondayOfWeek(d){ const monday = new Date(d); monday.setDate(d.getDate() - ((d.getDay()+6)%7)); return monday; }

// Weekday count strictly after promise_date, up through today (Mon-Fri only, no holiday
// awareness). null if not past due (blank or future promise date) - the date buffer only ever
// hides rows that are actually overdue.
function businessDaysPast(row){
  if(!row.promise_date) return null;
  const pd = parseDateStr(row.promise_date);
  if(!pd) return null;
  const today = todayLocalMidnight();
  if(pd > today) return null;
  let count = 0;
  const d = new Date(pd);
  while(d.getTime() < today.getTime()){
    d.setDate(d.getDate() + 1);
    const day = d.getDay();
    if(day !== 0 && day !== 6) count++;
  }
  return count;
}

// Presets for the Large Orders ETA filter: business week runs Monday-Saturday.
function etaPresetRanges(){
  const today = todayLocalMidnight();
  const monday = mondayOfWeek(today);
  const thisWeekEnd = new Date(monday); thisWeekEnd.setDate(monday.getDate()+5);
  const nextMonday = new Date(monday); nextMonday.setDate(monday.getDate()+7);
  const nextWeekEnd = new Date(nextMonday); nextWeekEnd.setDate(nextMonday.getDate()+5);
  const next30End = new Date(today); next30End.setDate(today.getDate()+30);
  return {
    thisWeek: { from: toDateStr(monday), to: toDateStr(thisWeekEnd) },
    nextWeek: { from: toDateStr(nextMonday), to: toDateStr(nextWeekEnd) },
    next30: { from: toDateStr(today), to: toDateStr(next30End) }
  };
}

function pastDaysOf(row){
  if(!row.promise_date) return null;
  const pd = parseDateStr(row.promise_date);
  if(!pd) return null;
  return daysBetween(todayLocalMidnight(), pd);
}
function bucketOf(row){
  if(!row.promise_date) return 'blank';
  const d = pastDaysOf(row);
  if(d === null) return 'blank';
  if(d <= 6) return 'current';
  if(d <= 13) return 'b7';
  if(d <= 20) return 'b14';
  if(d <= 27) return 'b21';
  return 'b28';
}

const BUCKET_ORDER = ['current','b7','b14','b21','b28','blank'];

function escapeAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtMoney(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return '$' + Number(n).toLocaleString(undefined,{maximumFractionDigits:0}); }
function fmtDate(s){ if(!s) return '—'; const d = parseDateStr(s); if(!d) return s; return (d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(2); }
function fmtPastDays(row){ const d = pastDaysOf(row); if(d===null) return 'Blank'; if(d<0) return `in ${-d}d`; if(d===0) return 'due today'; return `${d}d past`; }

// ---------- data loading ----------
async function loadAll(){
  let all = [];
  let from = 0;
  const pageSize = 1000;
  while(true){
    const { data, error } = await sb.from('po_lines').select('*').range(from, from + pageSize - 1);
    if(error) throw error;
    all = all.concat(data);
    if(data.length < pageSize) break;
    from += pageSize;
  }
  return all;
}

async function loadLastBatch(){
  const { data, error } = await sb.from('report_batches').select('*').eq('report_type', 'po_listing').order('uploaded_at', { ascending:false }).limit(1);
  if(error) throw error;
  return (data && data[0]) || null;
}

  return all;
}

// ---------- ETA changes (promise-date pushes across recent uploads) ----------
// Severity is by how many days a promise_date moved LATER between two uploads.
// Only pushes (new > old) count - a date pulled in is good news, not flagged.
// Bands mirror the app's existing past-due bucket spacing.
const CHANGES_WINDOW_BATCHES = 5;
const NEW_PO_LEAD_THRESHOLD_DAYS = 30; // flag a brand-new PO if its ETA is already more than this many days out
const SEVERITY_LABELS = { new: 'New PO, 30+ Days Out', major: 'Major (28+ days)', intermediate: 'Intermediate (14-27 days)', slight: 'Slight (7-13 days)' };
const SEVERITY_ORDER = ['new', 'major', 'intermediate', 'slight'];
function severityOf(deltaDays){
  if(deltaDays >= 28) return 'major';
  if(deltaDays >= 14) return 'intermediate';
  return 'slight'; // caller already filters out < 7
}

async function loadEtaChanges(){
  const { data: batches, error: batchErr } = await sb.from('report_batches')
    .select('*').eq('report_type', 'po_listing').order('uploaded_at', { ascending: false }).limit(CHANGES_WINDOW_BATCHES);
  if(batchErr) throw batchErr;
  if(!batches.length) return { batches: [], events: [] };

  const batchIds = batches.map(b=>b.id);
  let historyRows = [];
  let from = 0;
  const pageSize = 1000;
  while(true){
    const { data, error } = await sb.from('po_line_history')
      .select('po_number,batch_id,event_type,changes,detected_at')
      .in('batch_id', batchIds)
      .in('event_type', ['updated', 'reappeared', 'created'])
      .range(from, from + pageSize - 1);
    if(error) throw error;
    historyRows = historyRows.concat(data);
    if(data.length < pageSize) break;
    from += pageSize;
  }

  const batchById = new Map(batches.map(b=>[b.id, b]));
  const poByNumber = new Map(state.poLines.map(r=>[r.po_number, r]));

  const events = [];
  historyRows.forEach(h=>{
    if(h.event_type === 'created'){
      const po = poByNumber.get(h.po_number);
      if(!po || po.is_active === false || !po.promise_date) return;
      const daysOut = -pastDaysOf(po); // pastDaysOf is negative for a future date
      if(daysOut <= NEW_PO_LEAD_THRESHOLD_DAYS) return;
      const batch = batchById.get(h.batch_id);
      events.push({
        po_number: h.po_number,
        supplier: po.supplier,
        store: po.store,
        is_active: po.is_active,
        sales_person: po.sales_person,
        division: po.division,
        old_date: null,
        new_date: po.promise_date,
        delta_days: daysOut,
        severity: 'new',
        batch_id: h.batch_id,
        batch_date: batch ? batch.uploaded_at : null,
        batch_filename: batch ? batch.source_filename : null
      });
      return;
    }

    if(!Array.isArray(h.changes)) return;
    const pdChange = h.changes.find(c=>c.field === 'promise_date');
    if(!pdChange || !pdChange.old || !pdChange.new) return; // no prior date to push FROM, nothing to measure
    const oldD = parseDateStr(pdChange.old);
    const newD = parseDateStr(pdChange.new);
    if(!oldD || !newD) return;
    const deltaDays = daysBetween(newD, oldD); // positive = pushed later
    if(deltaDays < 7) return; // not a push, or below the Slight floor
    const po = poByNumber.get(h.po_number);
    const batch = batchById.get(h.batch_id);
    events.push({
      po_number: h.po_number,
      supplier: po ? po.supplier : null,
      store: po ? po.store : null,
      is_active: po ? po.is_active : null,
      sales_person: po ? po.sales_person : null,
      division: po ? po.division : null,
      old_date: pdChange.old,
      new_date: pdChange.new,
      delta_days: deltaDays,
      severity: severityOf(deltaDays),
      batch_id: h.batch_id,
      batch_date: batch ? batch.uploaded_at : null,
      batch_filename: batch ? batch.source_filename : null
    });
  });

  return { batches, events };
}

// ---------- Vendor Scorecard ----------
// A grade per vendor (po_lines.supplier) blending two automatic signals:
//   - On-time %: of closed POs with real evidence of delivery (some qty actually received,
//     so a silent cancellation doesn't count as "late"), did the PO close on/before its final
//     promise date?
//   - Push-back-free %: of all POs (open or closed), what share never had their promise date
//     pushed 7+ days later - the same threshold the ETA Changes tab uses for a real push vs. noise.
// Vendors with few POs on file have their score pulled toward a neutral C so a single early
// order can't swing them to an A+ or an F - see VENDOR_SCORE_FULL_CONFIDENCE_POS below.
const VENDOR_SCORE_PUSHBACK_THRESHOLD_DAYS = 7;
const VENDOR_SCORE_FULL_CONFIDENCE_POS = 20; // POs on file needed before a vendor's score counts fully
const VENDOR_SCORE_NEUTRAL = 75; // where a no-data / low-confidence vendor's score sits (a C)
const VENDOR_GRADE_BANDS = [ [90,'a'], [80,'b'], [70,'c'], [60,'d'], [-Infinity,'f'] ];
function vendorGradeOf(score){
  return VENDOR_GRADE_BANDS.find(([min])=>score >= min)[1];
}

async function computeVendorScorecard(){
  let historyRows = [];
  let from = 0;
  const pageSize = 1000;
  while(true){
    const { data, error } = await sb.from('po_line_history')
      .select('po_number,event_type,changes,detected_at')
      .in('event_type', ['updated', 'reappeared', 'manual_update', 'unverified_update', 'closed'])
      .range(from, from + pageSize - 1);
    if(error) throw error;
    historyRows = historyRows.concat(data);
    if(data.length < pageSize) break;
    from += pageSize;
  }

  const lastClosedAt = new Map(); // po_number -> latest 'closed' detected_at seen
  const pushedBack = new Set(); // po_number with at least one qualifying promise_date push
  historyRows.forEach(h=>{
    if(h.event_type === 'closed'){
      const prior = lastClosedAt.get(h.po_number);
      if(!prior || h.detected_at > prior) lastClosedAt.set(h.po_number, h.detected_at);
      return;
    }
    if(!Array.isArray(h.changes)) return;
    const pdChange = h.changes.find(c=>c.field === 'promise_date');
    if(!pdChange || !pdChange.old || !pdChange.new) return;
    const oldD = parseDateStr(pdChange.old);
    const newD = parseDateStr(pdChange.new);
    if(!oldD || !newD) return;
    if(daysBetween(newD, oldD) >= VENDOR_SCORE_PUSHBACK_THRESHOLD_DAYS) pushedBack.add(h.po_number);
  });

  const groups = new Map(); // supplier (or '(No Vendor Listed)') -> po_lines rows
  state.poLines.forEach(row=>{
    const key = row.supplier || '(No Vendor Listed)';
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(row);
  });

  const rows = [];
  groups.forEach((lines, vendor)=>{
    const totalPOs = lines.length;
    const openPOs = lines.filter(r=>r.is_active).length;
    const totalSpend = lines.reduce((s,r)=>s+(Number(r.total_cost)||0), 0);

    const deliveredClosed = lines.filter(r=>!r.is_active && receivedStatusOf(r) !== 'none');
    let onTimeCount = 0, onTimeEligible = 0;
    deliveredClosed.forEach(r=>{
      const closedAt = lastClosedAt.get(r.po_number);
      if(!closedAt || !r.promise_date) return;
      const closedDate = parseDateStr(closedAt.slice(0,10));
      const promiseDate = parseDateStr(r.promise_date);
      if(!closedDate || !promiseDate) return;
      onTimeEligible++;
      if(daysBetween(closedDate, promiseDate) <= 0) onTimeCount++;
    });
    const onTimePct = onTimeEligible ? (onTimeCount / onTimeEligible * 100) : null;

    const pushbackFreeCount = lines.filter(r=>!pushedBack.has(r.po_number)).length;
    const pushbackFreePct = totalPOs ? (pushbackFreeCount / totalPOs * 100) : null;

    // Each sub-score is shrunk toward neutral by ITS OWN sample size, not the vendor's overall PO
    // count - onTimeEligible (closed + confirmed-received + dated POs) is often far smaller than
    // totalPOs, and a vendor with hundreds of open POs but only 1 confirmed-late closed one
    // shouldn't get graded at full confidence off that single data point.
    const onTimeWeight = Math.min(1, onTimeEligible / VENDOR_SCORE_FULL_CONFIDENCE_POS);
    const pushbackWeight = Math.min(1, totalPOs / VENDOR_SCORE_FULL_CONFIDENCE_POS);
    const adjustedOnTime = onTimeWeight * (onTimePct ?? VENDOR_SCORE_NEUTRAL) + (1 - onTimeWeight) * VENDOR_SCORE_NEUTRAL;
    const adjustedPushback = pushbackWeight * (pushbackFreePct ?? VENDOR_SCORE_NEUTRAL) + (1 - pushbackWeight) * VENDOR_SCORE_NEUTRAL;
    const score = 0.5 * adjustedOnTime + 0.5 * adjustedPushback;

    rows.push({
      vendor, totalPOs, openPOs, totalSpend,
      onTimePct, onTimeEligible, pushbackFreePct,
      score, grade: vendorGradeOf(score),
      lowConfidence: onTimeWeight < 1 || pushbackWeight < 1
    });
  });

  return rows;
}

// ---------- render dispatch ----------
function render(){
  const app = document.getElementById('app');
  // Full re-render replaces every input's DOM node, which would otherwise drop focus
  // after each keystroke. Remember what was focused (and cursor position) and restore it.
  const active = document.activeElement;
  const focusInfo = (active && active.id && app.contains(active))
    ? { id: active.id, selStart: active.selectionStart, selEnd: active.selectionEnd }
    : null;

  if(state.view === 'rollup') app.innerHTML = renderRollup();
  else if(state.view === 'open') app.innerHTML = renderOpenTable();
  else if(state.view === 'large') app.innerHTML = renderLargeOrders();
  else if(state.view === 'genpo') app.innerHTML = renderGenPo();
  else if(state.view === 'changes') app.innerHTML = renderEtaChanges();
  else if(state.view === 'vendors') app.innerHTML = renderVendorScorecard();
  else if(state.view === 'upload') app.innerHTML = renderUpload();
  attachViewHandlers();

  if(focusInfo){
    const el = document.getElementById(focusInfo.id);
    if(el){
      el.focus();
      if(typeof el.setSelectionRange === 'function' && focusInfo.selStart != null){
        try { el.setSelectionRange(focusInfo.selStart, focusInfo.selEnd); } catch(e){}
      }
    }
  }
}

// ============================================================
// SCORECARD (composite of the Total row, weighted by IMPORTANCE)
// ============================================================
function renderScorecard(totals, totalAll, goals){
  let composite = 0;
  const rowsHtml = BUCKET_ORDER.map(b=>{
    const actualPct = totalAll ? totals[b] / totalAll : 0;
    const goalPct = goals[b];
    const score = scoreFor(b, actualPct, goalPct);
    const importance = IMPORTANCE[b];
    composite += score * importance;
    const scoreCls = score >= 0.9 ? 'cell-good' : score >= 0.6 ? 'cell-warn' : 'cell-bad';
    const impCls = importance >= 0.20 ? 'cell-bad' : importance >= 0.10 ? 'cell-warn' : 'cell-good';
    const goalDisplay = b === 'current' ? `≥ ${(goalPct*100).toFixed(0)}%` : `≤ ${(goalPct*100).toFixed(0)}%`;
    return `<tr>
      <td>${BUCKET_LABELS[b]}</td>
      <td>${goalDisplay}</td>
      <td>${(actualPct*100).toFixed(1)}%</td>
      <td class="${scoreCls}">${(score*100).toFixed(0)}%</td>
      <td class="${impCls}">${(importance*100).toFixed(0)}%</td>
    </tr>`;
  }).join('');
  const compositeCls = composite >= OVERALL_SCORE_GOAL ? 'cell-good' : 'cell-bad';

  return `
    <div class="panel">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px;">
        <h2 style="margin:0;font-size:15px;">Scorecard</h2>
        <div style="font-size:13px;display:flex;align-items:center;gap:10px;">
          <span style="color:var(--muted);">Composite Score</span>
          <span class="${compositeCls}" style="padding:3px 10px;border-radius:20px;font-size:14px;">${(composite*100).toFixed(1)}%</span>
          <span style="color:var(--muted);">vs. target ${(OVERALL_SCORE_GOAL*100).toFixed(0)}%</span>
        </div>
      </div>
      <table>
        <thead><tr><th>Bucket</th><th>Goal</th><th>Actual</th><th>Score</th><th>Importance</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
      <p style="color:var(--muted);font-size:12px;margin-top:12px;margin-bottom:0;">
        Score = how close Actual is to Goal (100% if met/beat, partial credit scaled by the gap if missed).
        Importance = each bucket's weight in the composite (edit <code>IMPORTANCE</code> in the source to retune).
      </p>
    </div>
  `;
}

// ============================================================
// MANAGER ROLLUP
// ============================================================
function renderRollup(){
  let active = state.poLines.filter(r=>r.is_active);
  if(state.rollupScope === 'purchasing') active = active.filter(r=>isPurchasingAssociate(r.ordered_by));
  const groupField = state.rollupGroupBy === 'store' ? 'store' : 'ordered_by';
  const groups = new Map();
  for(const row of active){
    const key = groupField==='store' ? (row.store ?? '—') : (row.ordered_by || '—');
    if(!groups.has(key)) groups.set(key, { current:0, b7:0, b14:0, b21:0, b28:0, blank:0 });
    const g = groups.get(key);
    const bucket = bucketOf(row);
    const val = state.rollupMetric === 'dollars' ? (Number(row.total_cost)||0) : 1;
    g[bucket] += val;
  }
  const totals = { current:0, b7:0, b14:0, b21:0, b28:0, blank:0 };
  active.forEach(row=>{
    const bucket = bucketOf(row);
    totals[bucket] += state.rollupMetric === 'dollars' ? (Number(row.total_cost)||0) : 1;
  });

  const goals = GOALS[state.rollupMetric];
  const rows = Array.from(groups.entries()).sort((a,b)=> String(a[0]).localeCompare(String(b[0]), undefined, {numeric:true}));

  function pctCell(bucketKey, value, rowTotal){
    const pct = rowTotal ? value/rowTotal : 0;
    const goal = goals[bucketKey];
    let cls = '';
    if(bucketKey === 'current'){ cls = pct >= goal ? 'cell-good' : 'cell-bad'; }
    else { cls = pct <= goal ? 'cell-good' : 'cell-bad'; }
    const display = state.rollupMetric === 'dollars' ? fmtMoney(value) : value;
    return `<td class="${cls}">${(pct*100).toFixed(0)}% <span style="font-weight:400;opacity:.65">(${display})</span></td>`;
  }

  const totalAll = Object.values(totals).reduce((a,b)=>a+b,0);

  return `
    <div class="stat-row">
      <div class="stat"><div class="num">${active.length.toLocaleString()}</div><div class="label">Open POs</div></div>
      <div class="stat"><div class="num">${fmtMoney(active.reduce((s,r)=>s+(Number(r.total_cost)||0),0))}</div><div class="label">Total $ Open</div></div>
    </div>
    ${renderScorecard(totals, totalAll, goals)}
    <div class="panel">
      <div class="toolbar">
        <span style="font-weight:700;">Metric:</span>
        <div class="toggle-group" id="metricToggle">
          <button data-metric="dollars" class="${state.rollupMetric==='dollars'?'active':''}">Dollars</button>
          <button data-metric="count" class="${state.rollupMetric==='count'?'active':''}">Count</button>
        </div>
        <span style="font-weight:700;margin-left:16px;">Group by:</span>
        <div class="toggle-group" id="groupToggle">
          <button data-group="ordered_by" class="${state.rollupGroupBy==='ordered_by'?'active':''}">Ordered By</button>
          <button data-group="store" class="${state.rollupGroupBy==='store'?'active':''}">Store</button>
        </div>
        <span style="font-weight:700;margin-left:16px;">Scope:</span>
        <div class="toggle-group" id="scopeToggle">
          <button data-scope="all" class="${state.rollupScope==='all'?'active':''}">All POs</button>
          <button data-scope="purchasing" class="${state.rollupScope==='purchasing'?'active':''}">Purchasing Associates</button>
        </div>
      </div>
      <table>
        <thead><tr>
          <th>${state.rollupGroupBy==='store'?'Store':'Ordered By'}</th>
          <th>Current</th><th>7 Days Past</th><th>14 Days Past</th><th>21 Days Past</th><th>28+ Days Past</th><th>Blank</th>
        </tr></thead>
        <tbody>
          <tr style="font-weight:700;background:#fafbfc;">
            <td>Total</td>
            ${BUCKET_ORDER.map(b=>pctCell(b, totals[b], totalAll)).join('')}
          </tr>
          ${rows.map(([key, g])=>{
            const rowTotal = Object.values(g).reduce((a,b)=>a+b,0);
            return `<tr><td>${key}</td>${BUCKET_ORDER.map(b=>pctCell(b, g[b], rowTotal)).join('')}</tr>`;
          }).join('')}
        </tbody>
      </table>
      <p style="color:var(--muted);font-size:12px;margin-top:12px;">
        Goals (${state.rollupMetric}): Current ≥ ${(goals.current*100).toFixed(0)}%,
        7d ≤ ${(goals.b7*100).toFixed(0)}%, 14d ≤ ${(goals.b14*100).toFixed(0)}%,
        21d ≤ ${(goals.b21*100).toFixed(0)}%, 28+ ≤ ${(goals.b28*100).toFixed(0)}%, Blank ≤ ${(goals.blank*100).toFixed(0)}%
      </p>
    </div>
  `;
}

// ============================================================
// filtering helpers (shared by the table, the filter cards, and CSV export)
// ============================================================
// Normalizes "EMILY.FOX" / "Emily Fox" / "emily fox" to the same key so near-duplicate
// spellings of the same person aggregate into one filter card instead of three.
function nameKey(name){ return (name||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }

// Purchasing team roster - used both for the "Purchasing Associates Only" filter and as the
// list of names in the "who's using this" identity picker (see IDENTITY section below).
const PURCHASING_ASSOCIATE_NAMES = ['Alani Copas','Chris Rose','Devan Stonebraker','Aundrea Wells',
  'Marissa Devore','Dave Levisay','Scott Burmeister','Todd Gies','Jude Hoferkamp','Mikel Hartman'];
// Ordered By values in the data are inconsistent (full name vs. last-name-only vs. truncated,
// e.g. "Devan Stonebraker" shows up as "DEVAN.STONEBRAK") so this matches on nameKey substring
// in either direction rather than requiring an exact match.
const PURCHASING_ASSOCIATE_KEYS = PURCHASING_ASSOCIATE_NAMES.map(nameKey);
function isPurchasingAssociate(orderedBy){
  const key = nameKey(orderedBy);
  if(!key) return false;
  return PURCHASING_ASSOCIATE_KEYS.some(assocKey => key.includes(assocKey) || assocKey.includes(key));
}

// 'none': nothing received yet. 'partial': some received, less than ordered. 'full': received
// meets or exceeds ordered (received can legitimately exceed ordered - it's cumulative across
// reorders on the same PO suffix, per the received-qty report).
// Amount Ordered (from the PO Listing report) is the REMAINING balance - RFMS decrements it
// as a PO gets received, it isn't a fixed original total. So as long as there's still a
// remaining balance (ordered > 0), the PO is partially received, no matter how large the
// all-time received count is (that count can span multiple reorders on the same PO suffix).
// Only once nothing remains (ordered <= 0) is it genuinely 'full'.
function receivedStatusOf(row){
  const received = Number(row.amount_received) || 0;
  const ordered = Number(row.amount_ordered) || 0;
  if(received <= 0) return 'none';
  if(ordered > 0) return 'partial';
  return 'full';
}

// Reconstructs the true original order quantity: remaining balance + what's already been
// received. Only meaningful while something is still outstanding ('partial'); once a PO is
// 'full' there's nothing remaining to add back, so just show Amount Ordered as-is.
function displayOrderedQty(row){
  const ordered = Number(row.amount_ordered) || 0;
  const received = Number(row.amount_received) || 0;
  return receivedStatusOf(row) === 'partial' ? ordered + received : ordered;
}

// Shared click behavior for multiselect filter cards: clicking "All" (value === '') clears
// the selection; clicking a value toggles it in/out of the array.
function toggleFilterValue(filtersObj, dim, value){
  if(value === ''){ filtersObj[dim] = []; return; }
  const arr = filtersObj[dim];
  const idx = arr.indexOf(value);
  if(idx === -1) arr.push(value); else arr.splice(idx, 1);
}

function isFutureOrToday(row){
  if(!row.promise_date) return false;
  const d = pastDaysOf(row); // negative = future, 0 = due today, positive = past due
  return d !== null && d <= 0;
}

function matchesFilters(r, filters, excludeDim){
  if(filters.activeOnly && !r.is_active) return false;
  if(filters.purchasingOnly && !isPurchasingAssociate(r.ordered_by)) return false;
  if(filters.futuresOnly ? !isFutureOrToday(r) : isFutureOrToday(r)) return false;
  if(excludeDim!=='orderedBy' && filters.orderedBy.length && !filters.orderedBy.includes(nameKey(r.ordered_by))) return false;
  if(excludeDim!=='store' && filters.store.length && !filters.store.includes(String(r.store))) return false;
  if(excludeDim!=='bucket' && filters.bucket.length && !filters.bucket.includes(bucketOf(r))) return false;
  if(excludeDim!=='worked' && filters.worked.length && !filters.worked.includes(String(!!r.worked))) return false;
  if(excludeDim!=='vendor' && filters.vendor.length && !filters.vendor.includes(r.supplier)) return false;
  if(filters.receivedStatus && receivedStatusOf(r) !== filters.receivedStatus) return false;
  if(state.dateBufferDays > 0){
    const bd = businessDaysPast(r);
    if(bd !== null && bd < state.dateBufferDays) return false;
  }
  if(filters.supplier && !(r.supplier||'').toLowerCase().includes(filters.supplier.toLowerCase())) return false;
  if(filters.search){
    const s = filters.search.toLowerCase();
    const hit = (r.po_number||'').toLowerCase().includes(s) || (r.style_name||'').toLowerCase().includes(s) || (r.sidemark||'').toLowerCase().includes(s) || (r.reference_number||'').toLowerCase().includes(s);
    if(!hit) return false;
  }
  return true;
}
function filterRows(filters){ return state.poLines.filter(r=>matchesFilters(r, filters, null)); }

function storeOptionsList(){
  return Array.from(new Set(state.poLines.map(r=>r.store).filter(v=>v!==null && v!==undefined)))
    .sort((a,b)=>a-b)
    .map(v=>({ value: String(v), label: `Store ${v}` }));
}
function productCodeOptionsList(){
  return Array.from(new Set(state.poLines.map(r=>r.product_code).filter(v=>v)))
    .sort((a,b)=>a.localeCompare(b))
    .map(v=>({ value: v, label: productCodeLabel(v) }));
}
function vendorOptionsList(){
  return Array.from(new Set(state.poLines.map(r=>r.supplier).filter(v=>v)))
    .sort((a,b)=>a.localeCompare(b))
    .map(v=>({ value: v, label: v }));
}

// counts per option for one filter dimension, honoring every OTHER active filter (facet counts)
function facetCounts(dim){
  const counts = new Map();
  state.poLines.forEach(r=>{
    if(!matchesFilters(r, state.filters, dim)) return;
    let key;
    if(dim === 'orderedBy') key = r.ordered_by ? nameKey(r.ordered_by) : null;
    else if(dim === 'store') key = (r.store===null||r.store===undefined) ? null : String(r.store);
    else if(dim === 'worked') key = String(!!r.worked);
    else if(dim === 'vendor') key = r.supplier || null;
    else key = bucketOf(r);
    if(key === null) return;
    counts.set(key, (counts.get(key)||0) + 1);
  });
  return counts;
}

// picks one canonical display label per normalized Ordered By key (most frequent, longest as tiebreak)
function orderedByCanonicalLabels(){
  const groups = new Map();
  state.poLines.forEach(r=>{
    if(!r.ordered_by) return;
    const key = nameKey(r.ordered_by);
    if(!groups.has(key)) groups.set(key, new Map());
    const m = groups.get(key);
    m.set(r.ordered_by, (m.get(r.ordered_by)||0) + 1);
  });
  const labels = new Map();
  for(const [key, variants] of groups){
    let best = null, bestScore = -1;
    for(const [label, count] of variants){
      const score = count*1000 + label.length;
      if(score > bestScore){ bestScore = score; best = label; }
    }
    labels.set(key, best);
  }
  return labels;
}

function renderFilterCardRow(labelText, dim, options){
  const counts = facetCounts(dim);
  const totalCount = state.poLines.filter(r=>matchesFilters(r, state.filters, dim)).length;
  const activeVals = state.filters[dim];
  const visibleOptions = options.filter(o=>(counts.get(o.value)||0) > 0);
  return `
    <div class="filter-row">
      <div class="filter-row-label">${labelText}</div>
      <div class="filter-cards">
        <button type="button" class="filter-card ${!activeVals.length?'active':''}" data-dim="${dim}" data-value="">All <span class="count">${totalCount}</span></button>
        ${visibleOptions.map(o=>`<button type="button" class="filter-card ${activeVals.includes(o.value)?'active':''}" data-dim="${dim}" data-value="${o.value}">${o.label} <span class="count">${counts.get(o.value)||0}</span></button>`).join('')}
      </div>
    </div>
  `;
}

function matchesLargeFilters(r, filters, excludeDim){
  if(filters.activeOnly && !r.is_active) return false;
  if(Number(r.amount_ordered) < filters.threshold) return false;
  if(excludeDim!=='store' && filters.store.length && !filters.store.includes(String(r.store))) return false;
  if(excludeDim!=='productCode' && filters.productCode.length && !filters.productCode.includes(r.product_code)) return false;
  if(filters.etaMode === 'specific'){
    if(filters.etaDate && r.promise_date !== filters.etaDate) return false;
  } else {
    if(filters.etaFrom && (!r.promise_date || r.promise_date < filters.etaFrom)) return false;
    if(filters.etaTo && (!r.promise_date || r.promise_date > filters.etaTo)) return false;
  }
  if(filters.poSearch && !(r.po_number||'').toLowerCase().includes(filters.poSearch.toLowerCase())) return false;
  return true;
}

function genPoDaysOutstanding(r){
  if(!r.first_seen_at) return null;
  const d = new Date(r.first_seen_at);
  d.setHours(0,0,0,0);
  return daysBetween(todayLocalMidnight(), d);
}
function genPoAgeBucket(days){
  if(days === null) return 'blank';
  if(days <= 6) return 'current';
  if(days <= 13) return 'b7';
  if(days <= 27) return 'b14';
  return 'b21';
}

function matchesGenPoFilters(r, filters, excludeDim){
  if(filters.activeOnly && !r.is_active) return false;
  // The report's whole purpose is spotting lines that persist across uploads, not lines that
  // just showed up today - hide those by default (days_outstanding is null only if
  // first_seen_at is somehow missing, which shouldn't happen, so don't treat null as "new").
  if(filters.hideNewToday && genPoDaysOutstanding(r) === 0) return false;
  if(excludeDim!=='supplier' && filters.supplier.length && !filters.supplier.includes(r.supplier)) return false;
  if(excludeDim!=='pc' && filters.pc.length && !filters.pc.includes(String(r.pc))) return false;
  if(excludeDim!=='holdType' && filters.holdType.length && !filters.holdType.includes(r.hold_type || '(none)')) return false;
  if(filters.stockOnly === 'stock' && !r.is_stock_item) return false;
  if(filters.stockOnly === 'nonstock' && r.is_stock_item) return false;
  if(filters.search){
    const s = filters.search.toLowerCase();
    const hit = (r.order_number||'').toLowerCase().includes(s) || (r.style_item||'').toLowerCase().includes(s)
      || (r.job_number||'').toLowerCase().includes(s) || (r.supplier||'').toLowerCase().includes(s) || (r.sku||'').toLowerCase().includes(s);
    if(!hit) return false;
  }
  return true;
}
function filterGenPoRows(filters){ return state.genPoLines.filter(r=>matchesGenPoFilters(r, filters, null)); }

async function openGenPoHistoryModal(lineKey){
  const row = state.genPoLines.find(r=>r.line_key === lineKey);
  showModal(`<span class="close" id="modalClose">&times;</span><h2>${escapeAttr(lineKey)}</h2><p class="empty">Loading history…</p>`);
  document.getElementById('modalClose').addEventListener('click', closeModal);

  const { data: history, error } = await sb.from('gen_po_line_history').select('*').eq('line_key', lineKey).order('detected_at', { ascending: true });
  if(error){ showModal(`<span class="close" id="modalClose">&times;</span><h2>${escapeAttr(lineKey)}</h2><p class="empty">Error loading history.</p>`); document.getElementById('modalClose').addEventListener('click', closeModal); return; }

  const header = row ? `
    <div style="font-size:13px;color:var(--muted);margin-bottom:14px;">
      ${row.supplier || ''} · ${row.style_item || ''} ${row.color_desc ? ('· '+row.color_desc) : ''}<br>
      Order ${row.order_number}-${row.line} · Job ${row.job_number || '—'} · Key Date ${fmtDate(row.key_date)} · ${row.is_active===false ? '<span class="badge blank">closed</span>' : `<span class="badge ${genPoAgeBucket(genPoDaysOutstanding(row))}">${genPoDaysOutstanding(row)}d outstanding</span>`}
    </div>` : '';

  const events = history.map(ev=>{
    let body = '';
    if(ev.event_type === 'created'){ body = 'First appeared on an upload.'; }
    else if(ev.event_type === 'closed'){ body = 'No longer on the export (shipped / received / canceled elsewhere).'; }
    else if(ev.event_type === 'reappeared'){ body = 'Back on the export after being closed.'; }
    else if(ev.event_type === 'updated'){
      body = (ev.changes||[]).map(c=>`<div class="tl-diff"><span class="f">${c.field}:</span> ${c.old ?? '—'} → <strong>${c.new ?? '—'}</strong></div>`).join('');
    }
    else if(ev.event_type === 'worked'){ body = 'Marked as worked.' + (ev.changes && ev.changes.note ? `<div class="tl-diff"><span class="f">Note:</span> ${escapeAttr(ev.changes.note)}</div>` : ''); }
    else if(ev.event_type === 'unworked'){ body = 'Unmarked as worked.' + (ev.changes && ev.changes.note ? `<div class="tl-diff"><span class="f">Note:</span> ${escapeAttr(ev.changes.note)}</div>` : ''); }
    return `<div class="tl-event">
      <div class="tl-date">${new Date(ev.detected_at).toLocaleString()}${ev.actor ? ` · <span style="color:var(--accent);">${escapeAttr(ev.actor)}</span>` : ''}</div>
      <div class="tl-type">${ev.event_type}</div>
      ${body}
    </div>`;
  }).join('') || '<p class="empty">No history yet.</p>';

  showModal(`<span class="close" id="modalClose">&times;</span><h2>${escapeAttr(lineKey)}</h2>${header}<div class="timeline">${events}</div>`);
  document.getElementById('modalClose').addEventListener('click', closeModal);
}

async function confirmGenPoWorkedToggle(lineKey, newValue){
  const row = state.genPoLines.find(r=>r.line_key === lineKey);
  if(!row) return;
  const note = document.getElementById('genPoWorkedNoteInput').value.trim();
  const btn = document.getElementById('genPoWorkedConfirmBtn');
  const errBox = document.getElementById('genPoWorkedConfirmError');
  btn.disabled = true; btn.textContent = 'Saving…';
  const nowIso = new Date().toISOString();
  try{
    const { error } = await sb.from('gen_po_lines').update({ worked: newValue, worked_at: newValue ? nowIso : null }).eq('line_key', lineKey);
    if(error) throw error;
    const { error: histErr } = await sb.from('gen_po_line_history').insert({
      line_key: lineKey, batch_id: null, event_type: newValue ? 'worked' : 'unworked',
      changes: note ? { note } : null, actor: state.currentUser, detected_at: nowIso
    });
    if(histErr) throw histErr;
    row.worked = newValue;
    row.worked_at = newValue ? nowIso : null;
    closeModal();
    render();
  } catch(err){
    errBox.textContent = 'Error saving: ' + err.message;
    errBox.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Confirm';
  }
}

function changesSeverityFacetCounts(events){
  const counts = new Map();
  events.forEach(e=>counts.set(e.severity, (counts.get(e.severity)||0) + 1));
  return counts;
}

// Currently-filtered change events, shared by the table render and the Notify Salespeople
// modal so "Notify" acts on whatever severities are filtered in, not the whole window.
function filteredChangesEvents(){
  if(!state.changesData || !state.changesData.events) return [];
  const events = state.changesData.events;
  const activeSeverities = state.changesFilters.severity;
  return activeSeverities.length ? events.filter(e=>activeSeverities.includes(e.severity)) : events.slice();
}

  if(state.changesLoading){
    return `<div class="panel"><p style="color:var(--muted);">Loading recent ETA changes…</p></div>`;
  }

function titleCase(s){
  return String(s||'').trim().toLowerCase().replace(/\b\w/g, c=>c.toUpperCase());
}

// Best-effort only - first token as first name, last token as last name. No directory
// lookup exists for Sales Person, so this is a guess the user can correct in the modal
// before opening each draft.
function guessEmailFromName(name){
  const parts = String(name||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(!parts.length) return '';
  if(parts.length === 1) return `${parts[0]}@afsgroup.com`;
  return `${parts[0]}.${parts[parts.length-1]}@afsgroup.com`;
}

function groupChangesBySalesperson(events){
  const groups = new Map();
  events.forEach(e=>{
    if(!e.sales_person) return;
    if(!groups.has(e.sales_person)) groups.set(e.sales_person, []);
    groups.get(e.sales_person).push(e);
  });
  return groups;
}

function buildNotifyEmailBody(name, list){
  const sorted = list.slice().sort((a,b)=>b.delta_days - a.delta_days);
  const firstName = titleCase(String(name||'').trim().split(/\s+/)[0] || name);
  const lines = [
    `Hi ${firstName},`,
    '',
    `The following ${sorted.length} PO${sorted.length===1?'':'s'} need your attention on a recent upload:`,
    ''
  ];
  sorted.forEach(e=>{
    const detail = e.severity === 'new'
      ? `new PO, ETA already ${e.delta_days}d out (${fmtDate(e.new_date)})`
      : `${fmtDate(e.old_date)} -> ${fmtDate(e.new_date)} (${e.delta_days}d later, ${e.severity})`;
    lines.push(`- PO ${e.po_number} (Store ${e.store ?? '—'}, ${e.supplier || 'Unknown supplier'}): ${detail}`);
  });
  lines.push('', 'Let me know if you have questions.');
  return lines.join('\n');
}

// Keeps the subject line readable when someone has a lot of changed POs.
function subjectPoList(list){
  const MAX = 5;
  const nums = list.map(e=>e.po_number);
  if(nums.length <= MAX) return nums.join(', ');
  return nums.slice(0, MAX).join(', ') + ` +${nums.length - MAX} more`;
}

function openMailtoDraft(name, email, list){
  const subject = `ETA update: PO${list.length===1?'':'s'} ${subjectPoList(list)} pushed later`;
  const body = buildNotifyEmailBody(name, list);
  const to = (email||'').trim();
  const mailtoUrl = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  // window.open (not repeated location.href) so the mail app launch is tied to this call's
  // own user gesture rather than clobbering/reusing the previous navigation's.
  const win = window.open(mailtoUrl, '_blank');
  if(win) setTimeout(()=>{ try{ win.close(); }catch(e){} }, 500); // mailto leaves a blank tab in some browsers
}

function openNotifySalespeopleModal(){
  const rows = filteredChangesEvents();
  const groups = groupChangesBySalesperson(rows);
  const namedCount = Array.from(groups.values()).reduce((sum,list)=>sum+list.length, 0);
  const skipped = rows.length - namedCount;
  const names = Array.from(groups.keys()).sort((a,b)=>a.localeCompare(b));

  if(!names.length){
    showModal(`
      <h2>Notify Salespeople</h2>
      <p style="color:var(--muted);font-size:13px;">None of the ${rows.length} change${rows.length===1?'':'s'} currently shown have a Salesperson on file, so there's nothing to draft.</p>
    `);
    return;
  }

  showModal(`
    <h2>Notify Salespeople</h2>
    <p style="color:var(--muted);font-size:13px;">
      ${names.length} salesperson${names.length===1?'':'s'} across ${namedCount} change${namedCount===1?'':'s'} currently shown${skipped ? ` (${skipped} change${skipped===1?'':'s'} skipped — no Salesperson on file)` : ''}.
      Email addresses are guessed as firstname.lastname@afsgroup.com — check each one before opening.
    </p>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
      <label style="font-size:13px;"><input type="checkbox" id="notifySelectAll" checked> Select all</label>
      <button type="button" class="btn" id="notifyOpenSelectedBtn">Open Selected Drafts (<span id="notifySelectedCount">${names.length}</span>)</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;max-height:50vh;overflow-y:auto;">
      ${names.map((name,i)=>{
        const list = groups.get(name);
        const inputId = 'notifyEmail_' + i;
        const checkId = 'notifyCheck_' + i;
        return `
          <div class="notify-person-row" data-name="${escapeAttr(name)}" style="border:1px solid var(--border);border-radius:8px;padding:10px 12px;">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
              <label style="display:flex;align-items:center;gap:6px;font-weight:700;">
                <input type="checkbox" class="notify-person-checkbox" id="${checkId}" data-name="${escapeAttr(name)}" checked>
                ${escapeAttr(titleCase(name))}
              </label>
              <span style="color:var(--muted);font-size:12.5px;" class="notify-person-status">${list.length} PO${list.length===1?'':'s'}</span>
            </div>
            <input type="email" id="${inputId}" value="${escapeAttr(guessEmailFromName(name))}" style="width:100%;margin-top:6px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;">
            <button type="button" class="btn secondary notify-draft-btn" data-name="${escapeAttr(name)}" data-input="${inputId}" style="margin-top:8px;">Open Draft</button>
          </div>
        `;
      }).join('')}
    </div>
  `);

  function updateSelectedCount(){
    const checked = document.querySelectorAll('.notify-person-checkbox:checked').length;
    const countEl = document.getElementById('notifySelectedCount');
    if(countEl) countEl.textContent = checked;
    const selectAll = document.getElementById('notifySelectAll');
    if(selectAll){
      selectAll.checked = checked === names.length;
      selectAll.indeterminate = checked > 0 && checked < names.length;
    }
  }

  document.getElementById('notifySelectAll')?.addEventListener('change', (e)=>{
    document.querySelectorAll('.notify-person-checkbox').forEach(cb=>{ cb.checked = e.target.checked; });
    updateSelectedCount();
  });
  document.querySelectorAll('.notify-person-checkbox').forEach(cb=>{
    cb.addEventListener('change', updateSelectedCount);
  });

  function markOpened(name){
    const row = document.querySelector(`.notify-person-row[data-name="${cssEscape(name)}"]`);
    const status = row?.querySelector('.notify-person-status');
    if(status) status.textContent = 'Opened ✓';
  }

  document.querySelectorAll('.notify-draft-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const name = btn.dataset.name;
      const email = document.getElementById(btn.dataset.input).value;
      openMailtoDraft(name, email, groups.get(name));
      markOpened(name);
    });
  });

  // Launching a mail app (mailto:) is more restricted than opening a browser popup: Windows/the
  // browser only allow ONE external-app launch per real user click, no matter how the code fires
  // it - looping through several in one handler silently drops every one after the first. So
  // instead of trying to open them all at once, this button opens ONE draft per click and
  // relabels itself "Open Next Draft" until every selected person has been opened - each click is
  // its own genuine user gesture, so each one is allowed through.
  let notifyQueue = null;
  const openSelectedBtn = document.getElementById('notifyOpenSelectedBtn');
  openSelectedBtn?.addEventListener('click', ()=>{
    if(!notifyQueue || notifyQueue.index >= notifyQueue.names.length){
      const selected = Array.from(document.querySelectorAll('.notify-person-checkbox:checked')).map(cb=>cb.dataset.name);
      notifyQueue = { names: selected, index: 0 };
    }
    const name = notifyQueue.names[notifyQueue.index];
    if(name){
      const btn = document.querySelector(`.notify-draft-btn[data-name="${cssEscape(name)}"]`);
      const email = btn ? document.getElementById(btn.dataset.input).value : guessEmailFromName(name);
      openMailtoDraft(name, email, groups.get(name));
      markOpened(name);
      notifyQueue.index++;
    }
    if(notifyQueue.index < notifyQueue.names.length){
      openSelectedBtn.textContent = `Open Next Draft (${notifyQueue.index+1} of ${notifyQueue.names.length})`;
    } else {
      notifyQueue = null;
      openSelectedBtn.textContent = 'All opened ✓';
      openSelectedBtn.disabled = true;
    }
  });
}

function cssEscape(s){
  return window.CSS && CSS.escape ? CSS.escape(s) : String(s).replace(/["\\]/g, '\\$&');
}

function attachUploadHandlers(){
  document.getElementById('showAllSalesResultsBtn')?.addEventListener('click', ()=>{ state.showAllSalesResults = true; render(); });
  const dz = document.getElementById('dropzone');
  if(dz){
    const fileInput = document.getElementById('fileInput');
    dz.addEventListener('click', ()=>fileInput.click());
    fileInput.addEventListener('change', (e)=>{ if(e.target.files[0]){ state.stagedListingFile = e.target.files[0]; render(); } });
    ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev, (e)=>{ e.preventDefault(); dz.classList.add('drag'); }));
    ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev, (e)=>{ e.preventDefault(); dz.classList.remove('drag'); }));
    dz.addEventListener('drop', (e)=>{ const f = e.dataTransfer.files[0]; if(f){ state.stagedListingFile = f; render(); } });
  }
  document.getElementById('clearListingFileBtn')?.addEventListener('click', ()=>{ state.stagedListingFile = null; render(); });
  const rdz = document.getElementById('receivedDropzone');
  if(rdz){
    const receivedFileInput = document.getElementById('receivedFileInput');
    rdz.addEventListener('click', ()=>receivedFileInput.click());
    receivedFileInput.addEventListener('change', (e)=>{ if(e.target.files[0]){ state.stagedSummaryFile = e.target.files[0]; render(); } });
    ['dragenter','dragover'].forEach(ev=>rdz.addEventListener(ev, (e)=>{ e.preventDefault(); rdz.classList.add('drag'); }));
    ['dragleave','drop'].forEach(ev=>rdz.addEventListener(ev, (e)=>{ e.preventDefault(); rdz.classList.remove('drag'); }));
    rdz.addEventListener('drop', (e)=>{ const f = e.dataTransfer.files[0]; if(f){ state.stagedSummaryFile = f; render(); } });
  }
  document.getElementById('clearSummaryFileBtn')?.addEventListener('click', ()=>{ state.stagedSummaryFile = null; render(); });
  const gdz = document.getElementById('genPoDropzone');
  if(gdz){
    const genPoFileInput = document.getElementById('genPoFileInput');
    gdz.addEventListener('click', ()=>genPoFileInput.click());
    genPoFileInput.addEventListener('change', (e)=>{ if(e.target.files[0]) stageGenPoFile(e.target.files[0]); });
    ['dragenter','dragover'].forEach(ev=>gdz.addEventListener(ev, (e)=>{ e.preventDefault(); gdz.classList.add('drag'); }));
    ['dragleave','drop'].forEach(ev=>gdz.addEventListener(ev, (e)=>{ e.preventDefault(); gdz.classList.remove('drag'); }));
    gdz.addEventListener('drop', (e)=>{ const f = e.dataTransfer.files[0]; if(f) stageGenPoFile(f); });
  }
  document.getElementById('clearGenPoFileBtn')?.addEventListener('click', clearGenPoStagedFile);
  document.getElementById('confirmGenPoUploadBtn')?.addEventListener('click', confirmGenPoUpload);
  document.getElementById('genPoSheetSelect')?.addEventListener('change', (e)=>{ state.stagedGenPoPreview.selectedSheetName = e.target.value; render(); });
  const sdz = document.getElementById('salesDropzone');
  if(sdz){
    const salesFileInput = document.getElementById('salesFileInput');
    sdz.addEventListener('click', ()=>salesFileInput.click());
    salesFileInput.addEventListener('change', (e)=>{ if(e.target.files[0]) parseAndProcessSalesFile(e.target.files[0]); });
    ['dragenter','dragover'].forEach(ev=>sdz.addEventListener(ev, (e)=>{ e.preventDefault(); sdz.classList.add('drag'); }));
    ['dragleave','drop'].forEach(ev=>sdz.addEventListener(ev, (e)=>{ e.preventDefault(); sdz.classList.remove('drag'); }));
    sdz.addEventListener('drop', (e)=>{ const f = e.dataTransfer.files[0]; if(f) parseAndProcessSalesFile(f); });
  }
  document.getElementById('runUploadBtn')?.addEventListener('click', runQueuedUploads);
  document.getElementById('saveDateBufferBtn')?.addEventListener('click', async ()=>{
    const raw = parseInt(document.getElementById('dateBufferInput').value, 10);
    const days = (isNaN(raw) || raw < 0) ? 0 : raw;
    const btn = document.getElementById('saveDateBufferBtn');
    const errBox = document.getElementById('dateBufferError');
    const savedMsg = document.getElementById('dateBufferSavedMsg');
    errBox.classList.add('hidden');
    btn.disabled = true; btn.textContent = 'Saving…';
    try{
      await saveDateBufferDays(days);
      state.dateBufferDays = days;
      btn.disabled = false; btn.textContent = 'Save';
      savedMsg.classList.remove('hidden');
      setTimeout(()=>savedMsg.classList.add('hidden'), 2000);
    } catch(err){
      btn.disabled = false; btn.textContent = 'Save';
      errBox.textContent = 'Error saving: ' + err.message;
      errBox.classList.remove('hidden');
    }
  });
}

function parseDateYYYYMMDD(v){
  if(v === undefined || v === null) return null;
  const s = String(v).trim();
  if(!/^\d{8}$/.test(s)) return null;
  const y = s.slice(0,4), m = s.slice(4,6), d = s.slice(6,8);
  return `${y}-${m}-${d}`;
}
function numOr(v, fallback){
  const n = parseFloat(v);
  return isNaN(n) ? fallback : n;
}

function mapCsvRow(r){
  const po_number = (r['PO Number']||'').trim();
  if(!po_number) return null;
  const storeRaw = (r['Store']||'').toString().trim();
  const store = storeRaw === '' ? null : parseInt(storeRaw, 10);
  const gross_cost = numOr(r['Gross Cost'], 0);
  const amount_ordered = numOr(r['Amount Ordered'], 0);
  return {
    po_number,
    store: isNaN(store) ? null : store,
    supplier: (r['Supplier']||'').trim() || null,
    product_code: (r['Product Code']||'').trim() || null,
    style_name: (r['Style / Name']||'').trim() || null,
    color_desc: (r['Color / Desc']||'').trim() || null,
    sidemark: (r['Sidemark']||'').trim() || null,
    amount_ordered,
    units: (r['Units']||'').trim() || null,
    promise_date: parseDateYYYYMMDD(r['Promise Date']),
    order_date: parseDateYYYYMMDD(r['Order Date']),
    status: (r['Status']||'').trim() || null,
    ordered_by: (r['Ordered By']||'').trim() || null,
    taken_by: (r['Taken By']||'').trim() || null,
    style_number: (r['Style Number']||'').trim() || null,
    manufacturer: (r['Manufacturer']||'').trim() || null,
    gross_cost,
    total_cost: Math.round(gross_cost * amount_ordered * 100) / 100,
    reference_number: (r['Reference #']||'').trim() || null
  };
}

function valuesEqual(a, b){
  const an = (a===undefined||a===null||a==='') ? null : a;
  const bn = (b===undefined||b===null||b==='') ? null : b;
  if(typeof an === 'number' || typeof bn === 'number'){
    const af = Number(an), bf = Number(bn);
    if(isNaN(af) && isNaN(bf)) return true;
    if(isNaN(af) || isNaN(bf)) return false;
    return Math.abs(af - bf) < 0.005;
  }
  return String(an ?? '') === String(bn ?? '');
}

async function upsertChunked(rows, chunkSize){
  for(let i=0; i<rows.length; i+=chunkSize){
    const chunk = rows.slice(i, i+chunkSize);
    const { error } = await sb.from('po_lines').upsert(chunk, { onConflict: 'po_number' });
    if(error) throw error;
    showProgress(`Saving PO lines… ${Math.min(i+chunkSize, rows.length).toLocaleString()} / ${rows.length.toLocaleString()}`, 40 + (i/rows.length)*40);
  }
}
async function insertChunked(table, rows, chunkSize){
  for(let i=0; i<rows.length; i+=chunkSize){
    const chunk = rows.slice(i, i+chunkSize);
    if(!chunk.length) continue;
    const { error } = await sb.from(table).insert(chunk);
    if(error) throw error;
  }
}

function parseAndProcessListingFile(file){
  return new Promise((resolve, reject)=>{
    showProgress('Parsing CSV…', 5);
    const openRows = [];
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      worker: true,
      step: (results)=>{
        const r = results.data;
        if((r['Status']||'').trim().toLowerCase() === 'open'){
          const mapped = mapCsvRow(r);
          if(mapped) openRows.push(mapped);
        }
      },
      complete: ()=>{ processUpload(openRows, file.name).then(resolve).catch(err=>{
        console.error(err);
        showProgress('Error: ' + err.message);
        setTimeout(hideProgress, 4000);
        reject(err);
      }); },
      error: (err)=>{ showProgress('Parse error: ' + err.message); setTimeout(hideProgress, 4000); reject(err); }
    });
  });
}

async function processUpload(openRowsRaw, filename){
  showProgress(`Parsed ${openRowsRaw.length.toLocaleString()} open rows. Deduplicating…`, 15);
  const byPo = new Map();
  openRowsRaw.forEach(r=>byPo.set(r.po_number, r)); // last one wins if dup within file
  const uploadRows = Array.from(byPo.values());

  showProgress('Creating batch record…', 20);
  const { data: batchRow, error: batchErr } = await sb.from('report_batches')
    .insert({ source_filename: filename, row_count: uploadRows.length }).select().single();
  if(batchErr) throw batchErr;
  const batchId = batchRow.id;

  showProgress('Loading current state…', 25);
  const existing = await loadAll();
  const existingByPo = new Map(existing.map(r=>[r.po_number, r]));
  const seenPoSet = new Set(uploadRows.map(r=>r.po_number));
  const nowIso = new Date().toISOString();

  const upserts = [];
  const historyEvents = [];

  for(const row of uploadRows){
    const prev = existingByPo.get(row.po_number);
    if(!prev){
      upserts.push({ ...row, first_seen_batch_id: batchId, first_seen_at: nowIso, last_seen_batch_id: batchId, last_seen_at: nowIso, is_active: true, worked: false, worked_at: null });
      historyEvents.push({ po_number: row.po_number, batch_id: batchId, event_type: 'created', changes: null, actor: state.currentUser, detected_at: nowIso });
    } else {
      const changes = [];
      FIELDS_TO_COMPARE.forEach(f=>{
        if(!valuesEqual(prev[f], row[f])) changes.push({ field: f, old: prev[f] ?? null, new: row[f] ?? null });
      });
      const wasInactive = prev.is_active === false;
      const promiseDateChanged = changes.some(c=>c.field === 'promise_date');
      // Worked is a "handled this cycle" flag, not a permanent one - every fresh upload resets it
      // so buyers re-review the current list rather than it staying checked off indefinitely.
      upserts.push({ ...row, first_seen_batch_id: prev.first_seen_batch_id, first_seen_at: prev.first_seen_at, last_seen_batch_id: batchId, last_seen_at: nowIso, is_active: true, worked: false, worked_at: null, ...(promiseDateChanged ? { pending_promise_date: null } : {}) });
      if(changes.length){
        historyEvents.push({ po_number: row.po_number, batch_id: batchId, event_type: wasInactive ? 'reappeared' : 'updated', changes, actor: state.currentUser, detected_at: nowIso });
      } else if(wasInactive){
        historyEvents.push({ po_number: row.po_number, batch_id: batchId, event_type: 'reappeared', changes: null, actor: state.currentUser, detected_at: nowIso });
      }
    }
  }

  const closedUpdates = [];
  for(const prev of existing){
    if(prev.is_active && !seenPoSet.has(prev.po_number)){
      closedUpdates.push({ po_number: prev.po_number, is_active: false });
      historyEvents.push({ po_number: prev.po_number, batch_id: batchId, event_type: 'closed', changes: null, actor: state.currentUser, detected_at: nowIso });
    }
  }

  showProgress(`Saving ${upserts.length.toLocaleString()} PO lines…`, 40);
  await upsertChunked(upserts, 500);
  if(closedUpdates.length){
    showProgress(`Marking ${closedUpdates.length.toLocaleString()} POs closed…`, 82);
    await upsertChunked(closedUpdates, 500);
  }
  showProgress(`Writing ${historyEvents.length.toLocaleString()} history events…`, 90);
  await insertChunked('po_line_history', historyEvents, 500);

  showProgress('Done. Refreshing…', 100);
  await refreshData();
  setTimeout(hideProgress, 1500);
}

async function processReceivedUpload(rows, filename){
  showProgress(`Parsed ${rows.length.toLocaleString()} rows. Matching to existing POs…`, 10);
  const existingPoSet = new Set(state.poLines.map(r=>r.po_number));
  const byPo = new Map();
  rows.forEach(r=>byPo.set(r.po_number, r.amount_received)); // last one wins if dup within file
  const toUpdate = Array.from(byPo.entries()).filter(([po])=>existingPoSet.has(po));
  const skipped = byPo.size - toUpdate.length;

  const CONCURRENCY = 20;
  let done = 0;
  for(let i=0; i<toUpdate.length; i+=CONCURRENCY){
    const batch = toUpdate.slice(i, i+CONCURRENCY);
    await Promise.all(batch.map(([po, amt])=>
      sb.from('po_lines').update({ amount_received: amt }).eq('po_number', po)
    ));
    done += batch.length;
    showProgress(`Updating PO lines… ${done.toLocaleString()} / ${toUpdate.length.toLocaleString()}`, 10 + (done/Math.max(toUpdate.length,1))*80);
  }

  showProgress(`Done. ${toUpdate.length.toLocaleString()} updated${skipped ? `, ${skipped.toLocaleString()} skipped (PO not found)` : ''}. Refreshing…`, 95);
  await saveLastReceivedUpload(filename);
  await refreshData();
  setTimeout(hideProgress, 2500);
}

// ============================================================
// OUTSTANDING GEN PO LINES upload (.xlsx export; the app finds the sheet with live data
// itself and does its own created/updated/closed history tracking, so the workbook's own
// per-date tabs don't need to be replicated here). Columns are read positionally because
// the header text/row differs between the "today" tab and the archived per-date tabs, but
// the data column order underneath is identical either way.
// ============================================================
const GENPO_HEADER_SIGNATURE = ['pc', 'style/item', 'order number'];
const GENPO_FIELDS_TO_COMPARE = ['supplier','sc','pc','style_item','color_desc','roll_item_number','width','length',
  'item_size','qty','units','unit_cost','total_cost','sku','install_date','key_date','line_del_date',
  'job_number','matched_inventory','hold_type','seq_num','is_stock_item'];

// Scans every sheet for a row matching GENPO_HEADER_SIGNATURE (within its first 5 rows).
// Prefers a sheet named "today" if it has data rows; otherwise picks whichever matching
// sheet has the most, since the workbook's archived per-date tabs are all valid matches too.
function findGenPoCandidates(workbook){
  const candidates = [];
  for(const name of workbook.SheetNames){
    const grid = XLSX.utils.sheet_to_json(workbook.Sheets[name], { header: 1, defval: '' });
    for(let i=0; i<Math.min(grid.length, 5); i++){
      const rowLower = (grid[i]||[]).map(c=>String(c||'').trim().toLowerCase());
      if(GENPO_HEADER_SIGNATURE.every(sig=>rowLower.includes(sig))){
        const dataRowCount = grid.slice(i+1).filter(r=>r[12] !== '' && r[12] != null).length; // col 12 = Order Number
        candidates.push({ name, headerRowIndex: i, dataRowCount, grid });
        break;
      }
    }
  }
  return candidates;
}

// When there's exactly one matching sheet, or a populated "today" sheet, that's an
// unambiguous choice worth auto-selecting. Otherwise (e.g. this workbook's many archived
// per-date tabs, with "today" not yet refreshed) there's no reliable way to know which
// tab is "current" from the name alone - defaulting to the largest and letting the sheet
// picker in the UI be overridden is safer than silently guessing wrong.
function pickDefaultGenPoSheet(candidates){
  if(candidates.length === 1) return candidates[0].name;
  const today = candidates.find(c=>c.name.toLowerCase() === 'today' && c.dataRowCount > 0);
  if(today) return today.name;
  return candidates.reduce((best,c)=> (!best || c.dataRowCount > best.dataRowCount) ? c : best, candidates[0]).name;
}

function genPoSelectedCandidate(){
  if(!state.stagedGenPoPreview) return null;
  return state.stagedGenPoPreview.candidates.find(c=>c.name === state.stagedGenPoPreview.selectedSheetName) || null;
}
function genPoSelectedDataRows(){
  const c = genPoSelectedCandidate();
  if(!c) return [];
  return c.grid.slice(c.headerRowIndex + 1).map(mapGenPoRow).filter(Boolean);
}

function parseDateCell(v){
  if(v === null || v === undefined || v === '') return null;
  if(v instanceof Date) return isNaN(v) ? null : toDateStr(v);
  const s = String(v).trim();
  if(!s) return null;
  const d = new Date(s);
  return isNaN(d) ? null : toDateStr(d);
}
function numOrNull(v){
  if(v === null || v === undefined || v === '') return null;
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}
function intOrNull(v){
  const n = numOrNull(v);
  return n === null ? null : Math.round(n);
}
function strOrNull(v){
  const s = String(v==null?'':v).trim();
  return s === '' ? null : s;
}

// Positional column mapping (0-based), matching Outstanding Gen PO Lines.xlsx's layout:
// Supplier, SC, PC, Style/Item, Color/Desc, Roll/Item #, Width, Length, Item Size, Qty,
// Units, Unit Cost, Order Number, Line, Total Cost, SKU, Install Date, Key Date,
// Line Del Date, Job Number, Matched Inventory, Hold Type, Seq Num, (dup Seq Num), ..., STOCK?
function mapGenPoRow(r){
  const order_number = strOrNull(r[12]);
  const line = intOrNull(r[13]);
  if(!order_number || line === null) return null;
  return {
    line_key: `${order_number}-${line}`,
    supplier: strOrNull(r[0]),
    sc: intOrNull(r[1]),
    pc: intOrNull(r[2]),
    style_item: strOrNull(r[3]),
    color_desc: strOrNull(r[4]),
    roll_item_number: strOrNull(r[5]),
    width: strOrNull(r[6]),
    length: strOrNull(r[7]),
    item_size: strOrNull(r[8]),
    qty: numOrNull(r[9]),
    units: strOrNull(r[10]),
    unit_cost: numOrNull(r[11]),
    order_number,
    line,
    total_cost: numOrNull(r[14]),
    sku: strOrNull(r[15]),
    install_date: parseDateCell(r[16]),
    key_date: parseDateCell(r[17]),
    line_del_date: parseDateCell(r[18]),
    job_number: strOrNull(r[19]),
    matched_inventory: strOrNull(r[20]),
    hold_type: strOrNull(r[21]),
    seq_num: strOrNull(r[22]),
    is_stock_item: !!r[27]
  };
}

// Unlike the other uploads on this page, this one parses the file and shows what it found
// (sheet name, row count) before writing anything - picking the wrong sheet out of a
// multi-hundred-tab workbook would otherwise silently corrupt the created/closed history.
async function stageGenPoFile(file){
  state.stagedGenPoFile = file;
  state.stagedGenPoPreview = null;
  state.genPoStageError = null;
  render();
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(new Uint8Array(buf), { type: 'array', cellDates: true });
    const candidates = findGenPoCandidates(wb);
    if(!candidates.length) throw new Error('Could not find a sheet with the expected header row (PC / Style/Item / Order Number).');
    state.stagedGenPoPreview = { candidates, selectedSheetName: pickDefaultGenPoSheet(candidates) };
  } catch(err){
    state.genPoStageError = err.message || String(err);
  }
  render();
}

function clearGenPoStagedFile(){
  state.stagedGenPoFile = null;
  state.stagedGenPoPreview = null;
  state.genPoStageError = null;
  render();
}

async function confirmGenPoUpload(){
  if(!state.stagedGenPoPreview) return;

}

// ============================================================
// SALES DATA (Open Orders Detailed .xlsx) - standalone upload, not part of the paired
// listing/summary queue. Only enriches sales_person/sales_entered_by/division on POs that
// already exist; never opens/closes/creates POs.
// ============================================================
// po_number is "<base order #>-<NNNN line suffix>", optionally "#"-prefixed for special-order
// tracking numbers (which have no corresponding sales order and simply won't match anything).
function salesInfoTooltip(row){
  const parts = [];
  if(row.sales_person) parts.push(`Sales Person: ${row.sales_person}`);
  if(row.sales_entered_by) parts.push(`Entered By: ${row.sales_entered_by}`);
  if(row.division) parts.push(`Division: ${row.division}`);
  return parts.join('\n');
}

function baseOrderNumber(poNumber){
  if(!poNumber) return null;
  return String(poNumber).replace(/^#/, '').replace(/-\d+$/, '');
}

// The report is a print-style export: each order is a variable-length block starting at a row
// whose first cell is "Order #: <num>", with labeled fields scattered at specific columns
// within roughly the next 10 rows. Scanning for the label text (rather than assuming fixed row
// offsets) is more robust to minor layout variation between orders.
function parseSalesGrid(grid){
  const map = new Map();
  for(let r = 0; r < grid.length; r++){
    const row = grid[r] || [];
    const first = row[0];
    if(typeof first !== 'string' || !first.trim().startsWith('Order #:')) continue;
    const orderNum = first.replace(/Order #:\s*/,'').trim();
    if(!orderNum) continue;
    const info = { sales_person: null, sales_entered_by: null, division: null };
    const windowEnd = Math.min(r + 10, grid.length - 1);
    for(let rr = r; rr <= windowEnd; rr++){
      const wrow = grid[rr] || [];
      for(let cc = 0; cc < wrow.length; cc++){
        const cell = wrow[cc];
        if(typeof cell !== 'string') continue;
        const t = cell.trim();
        if(t === 'Salesperson 1:' && wrow[cc+1]) info.sales_person = String(wrow[cc+1]).trim() || null;
        else if(t === 'Customer Type:' && wrow[cc+1]) info.division = String(wrow[cc+1]).trim() || null;
        else if(t.startsWith('Entered By:')){
          // value is "AMFS-VSRV-RDPn:firstname.lastname" in the same cell as the label
          const raw = t.slice('Entered By:'.length).trim();
          const parts = raw.split(':');
          info.sales_entered_by = (parts[parts.length-1] || raw).trim() || null;
        }
      }
    }
    map.set(orderNum, info);
  }
  return map;
}

// Raw RFMS export: print-style block layout, parsed via parseSalesGrid.
async function getSalesMapFromXlsx(file){
  const arrayBuffer = await file.arrayBuffer();
  const workbook = XLSX.read(arrayBuffer, { type: 'array' });
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  const grid = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: null });
  return parseSalesGrid(grid);
}

// Pre-extracted CSV from the offline ExtractSalesData.ps1 script: a flat table with headers
// "Order #", "Sales Person", "Entered By", "Division" - one row per order, no block-parsing needed.
function getSalesMapFromCsv(file){
  return new Promise((resolve, reject)=>{
    const map = new Map();
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: (results)=>{
        results.data.forEach(r=>{
          const orderNum = (r['Order #']||'').trim();
          if(!orderNum) return;
          map.set(orderNum, {
            sales_person: (r['Sales Person']||'').trim() || null,
            sales_entered_by: (r['Entered By']||'').trim() || null,
            division: (r['Division']||'').trim() || null
          });
        });
        resolve(map);
      },
      error: reject
    });
  });
}

async function parseAndProcessSalesFile(file){
  showProgress('Parsing sales data…', 5);
  try{
    const isCsv = /\.csv$/i.test(file.name);
    const salesMap = isCsv ? await getSalesMapFromCsv(file) : await getSalesMapFromXlsx(file);
    showProgress(`Parsed ${salesMap.size.toLocaleString()} sales orders. Matching to POs…`, 20);

    const toUpdate = [];
    for(const row of state.poLines){
      const base = baseOrderNumber(row.po_number);
      const info = base ? salesMap.get(base) : null;
      if(!info) continue;
      if(row.sales_person !== info.sales_person || row.sales_entered_by !== info.sales_entered_by || row.division !== info.division){
        toUpdate.push([row.po_number, info]);
      }
    }

    const CONCURRENCY = 20;
    let done = 0;
    for(let i=0; i<toUpdate.length; i+=CONCURRENCY){
      const batch = toUpdate.slice(i, i+CONCURRENCY);
      await Promise.all(batch.map(([po, info])=>
        sb.from('po_lines').update({ sales_person: info.sales_person, sales_entered_by: info.sales_entered_by, division: info.division }).eq('po_number', po)
      ));
      done += batch.length;
      showProgress(`Updating PO lines… ${done.toLocaleString()} / ${toUpdate.length.toLocaleString()}`, 20 + (done/Math.max(toUpdate.length,1))*70);
    }

    showProgress(`Done. ${toUpdate.length.toLocaleString()} POs updated from ${salesMap.size.toLocaleString()} sales orders. Refreshing…`, 95);
    await saveLastSalesUpload(file.name);
    await refreshData();
    setTimeout(hideProgress, 2500);
  } catch(err){
    console.error(err);
    showProgress('Error: ' + err.message);
    setTimeout(hideProgress, 4000);
  }
}

async function openHistoryModal(poNumber){
  const row = state.poLines.find(r=>r.po_number === poNumber);
  showModal(`<span class="close" id="modalClose">&times;</span><h2>${poNumber}</h2><p class="empty">Loading history…</p>`);
  document.getElementById('modalClose').addEventListener('click', closeModal);

  const { data: history, error } = await sb.from('po_line_history').select('*').eq('po_number', poNumber).order('detected_at', { ascending: true });
  if(error){ showModal(`<span class="close" id="modalClose">&times;</span><h2>${poNumber}</h2><p class="empty">Error loading history.</p>`); document.getElementById('modalClose').addEventListener('click', closeModal); return; }

  const header = row ? `
    <div style="font-size:13px;color:var(--muted);margin-bottom:14px;">
      ${row.supplier || ''} · ${row.style_name || ''} ${row.color_desc ? ('· '+row.color_desc) : ''}<br>
      Store ${row.store ?? '—'} · Ordered by ${row.ordered_by || '—'} · Promise ${fmtDate(row.promise_date)} · ${row.is_active===false ? '<span class="badge blank">closed</span>' : `<span class="badge ${bucketOf(row)}">${fmtPastDays(row)}</span>`}
    </div>` : '';

  const events = history.map(ev=>{
    let body = '';
    if(ev.event_type === 'created'){ body = 'First appeared on an upload.'; }
    else if(ev.event_type === 'closed'){ body = 'No longer on the Open export (shipped / satisfied / canceled elsewhere).'; }
    else if(ev.event_type === 'reappeared'){ body = 'Back on the Open export after being closed.'; }
    else if(ev.event_type === 'updated'){
      body = (ev.changes||[]).map(c=>`<div class="tl-diff"><span class="f">${c.field}:</span> ${c.old ?? '—'} → <strong>${c.new ?? '—'}</strong></div>`).join('');
    }
    else if(ev.event_type === 'manual_update'){
      body = (ev.changes||[]).map(c=>`<div class="tl-diff"><span class="f">${c.field}:</span> ${c.old ?? '—'} → <strong>${c.new ?? '—'}</strong>${c.field==='promise_date' ? ' <span style="color:var(--good);">(confirmed in RFMS)</span>' : ''}</div>`).join('');
    }
    else if(ev.event_type === 'unverified_update'){
      body = (ev.changes||[]).map(c=>`<div class="tl-diff"><span class="f">${c.field}:</span> ${c.old ?? '—'} → <strong>${c.new ?? '—'}</strong> <span style="color:var(--warn);">(unverified — not yet confirmed in RFMS)</span></div>`).join('');
    }
    else if(ev.event_type === 'worked'){ body = 'Marked as worked.' + (ev.changes && ev.changes.note ? `<div class="tl-diff"><span class="f">Note:</span> ${escapeAttr(ev.changes.note)}</div>` : ''); }
    else if(ev.event_type === 'unworked'){ body = 'Unmarked as worked.' + (ev.changes && ev.changes.note ? `<div class="tl-diff"><span class="f">Note:</span> ${escapeAttr(ev.changes.note)}</div>` : ''); }
    return `<div class="tl-event">
      <div class="tl-date">${new Date(ev.detected_at).toLocaleString()}${ev.actor ? ` · <span style="color:var(--accent);">${escapeAttr(ev.actor)}</span>` : ''}</div>
      <div class="tl-type">${ev.event_type}</div>
      ${body}
    </div>`;
  }).join('') || '<p class="empty">No history yet.</p>';

  showModal(`<span class="close" id="modalClose">&times;</span><h2>${poNumber}</h2>${header}<div class="timeline">${events}</div>`);
  document.getElementById('modalClose').addEventListener('click', closeModal);
}

async function savePromiseUpdate(poNumber){
  const row = state.poLines.find(r=>r.po_number === poNumber);
  if(!row) return;
  const newDate = document.getElementById('promiseDateInput').value || null;
  const verified = document.getElementById('rfmsCheckbox').checked;
  const btn = document.getElementById('promiseSaveBtn');
  const errBox = document.getElementById('promiseError');
  btn.disabled = true; btn.textContent = 'Saving…';
  const nowIso = new Date().toISOString();
  try{
    if(verified){
      const oldDate = row.promise_date;
      const { error } = await sb.from('po_lines').update({ promise_date: newDate, pending_promise_date: null }).eq('po_number', poNumber);
      if(error) throw error;
      if(!valuesEqual(oldDate, newDate)){
        const { error: histErr } = await sb.from('po_line_history').insert({ po_number: poNumber, batch_id: null, event_type: 'manual_update', changes: [{ field: 'promise_date', old: oldDate, new: newDate }], actor: state.currentUser, detected_at: nowIso });
        if(histErr) throw histErr;
      }
      row.promise_date = newDate;
      row.pending_promise_date = null;
    } else {
      const { error } = await sb.from('po_lines').update({ pending_promise_date: newDate }).eq('po_number', poNumber);
      if(error) throw error;
      const { error: histErr } = await sb.from('po_line_history').insert({ po_number: poNumber, batch_id: null, event_type: 'unverified_update', changes: [{ field: 'promise_date', old: row.promise_date, new: newDate }], actor: state.currentUser, detected_at: nowIso });
      if(histErr) throw histErr;
      row.pending_promise_date = newDate;
    }
    closeModal();
    render();
  } catch(err){
    errBox.textContent = 'Error saving: ' + err.message;
    errBox.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Save';
  }
}

function exportCsv(){
  const rows = filterRows(state.filters);
  const csv = Papa.unparse(rows.map(r=>({
    Worked: r.worked ? 'Yes' : 'No', Store: r.store, Supplier: r.supplier, 'PO Number': r.po_number, Style: r.style_name, Color: r.color_desc,
    'Ordered By': r.ordered_by, 'Order Date': r.order_date, 'Promise Date': r.promise_date,
    'Past Days': pastDaysOf(r), Bucket: BUCKET_LABELS[bucketOf(r)], 'Total Cost': r.total_cost, 'Reference #': r.reference_number
  })));
  const blob = new Blob([csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'eta-report-export.csv'; a.click();
  URL.revokeObjectURL(url);
}

// ---------- init ----------
// Allows deep-linking straight to a tab, e.g. ?view=large from the Purchasing Portal.
(function(){
  const requestedView = new URLSearchParams(window.location.search).get('view');
  if(['rollup','open','large','genpo'].includes(requestedView)){
    state.view = requestedView;
    document.querySelectorAll('#mainNav button[data-view]').forEach(b=>b.classList.toggle('active', b.dataset.view===requestedView));
  }
})();

document.getElementById('switchUserBtn').addEventListener('click', ()=>{
  clearStoredIdentity();
  state.currentUser = null;
  state.poLines = [];
  state.lastBatch = null;
  document.getElementById('lastUpdated').textContent = '';
  boot();
});

function boot(){
  const identity = getStoredIdentity();
  if(!identity){
    renderIdentityGate();
    return;
  }
  state.currentUser = identity;
  document.getElementById('currentUserLabel').textContent = identity;
  document.getElementById('identityBox').classList.remove('hidden');
  refreshData().catch(err=>{
    console.error(err);
    document.getElementById('app').innerHTML = `<div class="panel"><p class="empty">Failed to load data: ${err.message}</p></div>`;
  });
}
boot();
</script>
</body>
</html>
